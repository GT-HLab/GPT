<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a small GPT works, step by step</title>
<style>
:root{color-scheme:light dark;--bg:#FFFFFF;--surface-1:#F5F4EE;--surface-2:#FFFFFF;--text-primary:#1F1E1D;--text-secondary:#5F5E5A;--text-muted:#8A8880;--border:rgba(31,30,29,.15);--border-strong:rgba(31,30,29,.3);--border-stronger:rgba(31,30,29,.55);--radius:8px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1F1E1D;--surface-1:#2C2B29;--surface-2:#262624;--text-primary:#F1EFE8;--text-secondary:#B4B2A9;--text-muted:#8A8880;--border:rgba(241,239,232,.18);--border-strong:rgba(241,239,232,.32);--border-stronger:rgba(241,239,232,.55)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font);line-height:1.5}
.app{max-width:760px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.scroll{overflow-x:auto}
svg{display:block}
svg text{font-family:var(--font)}
.t{font-size:14px;fill:var(--text-primary)}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:4 3;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th,.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th,.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th,.c-coral .t{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th,.c-gray .t{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-blue>rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th,.c-blue .t{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green .th,.c-green .t{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th,.c-amber .t{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th,.c-purple .t{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal .th,.c-teal .t{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral .th,.c-coral .t{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}
.c-gray>rect{fill:#444441;stroke:#B4B2A9}.c-gray .th,.c-gray .t{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
.c-blue>rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th,.c-blue .t{fill:#B5D4F4}.c-blue .ts{fill:#85B7EB}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green .th,.c-green .t{fill:#C0DD97}.c-green .ts{fill:#97C459}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber .th,.c-amber .t{fill:#FAC775}.c-amber .ts{fill:#EF9F27}
}
button{font:inherit;font-size:13px;padding:5px 10px;background:transparent;color:var(--text-primary);border:.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer}
button:hover{background:var(--surface-1)}
button:focus-visible,input:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
#nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0}
#pills{display:flex;gap:6px;flex-wrap:wrap}
#pills button{padding:5px 9px;min-width:30px}
#nav button.on,#hb button.on,#hh button.on{background:var(--surface-1);border-color:var(--border-stronger);font-weight:500}
#ttl{font-size:15px;font-weight:500;margin:14px 0 4px}
#cap{font-size:14px;color:var(--text-secondary);margin:8px 0 0;min-height:22px}
#map{width:100%;height:auto;max-height:104px}
#cv{width:100%;height:auto;max-height:calc(100vh - 330px);min-height:300px}
@media (max-width:640px){#cv{min-width:560px;max-height:none}#map{min-width:560px}}
</style>
</head>
<body>
<main class="app">
<h1>How a small GPT works, step by step</h1>
<h2 class="sr-only">Complete step-by-step walkthrough of a small GPT including the three layer norms, all matrices and biases, per-head attention, the MLP, the output head, and the full training loop</h2>
<div class="scroll"><svg id="map" viewBox="0 0 680 108" role="img"><title>Where this step sits in the training loop</title><desc>Map of batch, embed, attention, add, MLP, output and loss, with the middle three repeated N times and a return arrow from the loss back to the batch. The current step is highlighted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="mapg"></g></svg></div>
<div id="nav"><button id="bk">Back</button><div id="pills"></div><button id="nx">Next</button></div>
<div id="hctl" style="display:none;align-items:center;gap:10px;margin:10px 0 0;flex-wrap:wrap"><span style="font-size:14px;color:var(--text-secondary)">Heads</span><div id="hb" style="display:flex;gap:6px"></div><span id="hl2" style="font-size:14px;color:var(--text-secondary);margin-left:8px">Show head</span><div id="hh" style="display:flex;gap:6px"></div></div>
<div id="tctl" style="display:none;align-items:center;gap:10px;margin:10px 0 0"><label for="trin" style="font-size:14px;color:var(--text-secondary)">Training progress</label><input type="range" id="trin" min="0" max="100" value="0" step="1" style="flex:1;max-width:320px"><span id="trv" style="font-size:14px;min-width:80px">step 0</span></div>
<p id="ttl"></p>
<div class="scroll"><svg id="cv" viewBox="0 0 680 360" role="img"><title>GPT walkthrough step</title><desc>Detail view of the current step of the model.</desc><defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="stage"></g></svg></div>
<p id="cap"></p>
</main>
<script>
const CH=['F','i','r','s','t','_','C','i'],ID=[18,47,56,57,58,1,15,47],TG=['i','r','s','t','_','C','i','t'],TID={i:47,r:56,s:57,t:58,_:1,C:15};
let cur=0,sel=7,hd=0,nh=4,hs=8,si=7,sj=4,tr=0,MK='arrow';
const hc=k=>k%2?'#1D9E75':'#EF9F27';
function v(s,k){const x=Math.sin(s*12.9898+k*78.233)*43758.5453;return x-Math.floor(x);}
function T(x,y,s,c,a){return `<text class="${c}" x="${x}" y="${y}" text-anchor="${a||'middle'}" dominant-baseline="central">${s}</text>`;}
function B(x,y,w,h,cls,t1,t2){return `<g class="${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" stroke-width="0.5"/>${t2?T(x+w/2,y+h/2-9,t1,'th')+T(x+w/2,y+h/2+9,t2,'ts'):T(x+w/2,y+h/2,t1,'th')}</g>`;}
function A(x1,y1,x2,y2){return `<line class="arr" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${MK})"/>`;}
function heat(x,y,rows,cols,cw,rh,col,fn,hl){let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){s+=`<rect x="${x+c*cw}" y="${y+r*rh}" width="${cw}" height="${rh}" fill="${col}" opacity="${(0.12+0.75*fn(r,c)).toFixed(2)}"/>`;}s+=`<rect x="${x}" y="${y}" width="${cols*cw}" height="${rows*rh}" fill="none" stroke="${col}" stroke-width="1"/>`;(hl||[]).forEach(r=>{s+=`<rect x="${x}" y="${y+r*rh}" width="${cols*cw}" height="${rh}" fill="none" stroke="#BA7517" stroke-width="2"/>`;});return s;}
function sheat(x,y,rows,cols,cw,rh,fn,sc,hl){let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const q=fn(r,c);s+=`<rect x="${x+c*cw}" y="${y+r*rh}" width="${cw}" height="${rh}" fill="${q>=0?'#378ADD':'#D85A30'}" opacity="${Math.min(0.95,0.06+Math.abs(q)/sc*0.9).toFixed(2)}"/>`;}s+=`<rect x="${x}" y="${y}" width="${cols*cw}" height="${rows*rh}" fill="none" stroke="#888780" stroke-width="0.5"/>`;(hl||[]).forEach(r=>{s+=`<rect x="${x}" y="${y+r*rh}" width="${cols*cw}" height="${rh}" fill="none" stroke="#BA7517" stroke-width="2"/>`;});return s;}
function b(h,i,j){const t=h%4;let x=v(h*97+i*11+2,j)*1.2;if(t==0)x=v(h*97+i*11+2,j)*2.2+(j==i?0.6:0)+(i==7&&j==4?1.8:0)+(i==7&&j==6?1.4:0);else if(t==1)x+=j==i-1?2.6:0;else if(t==2)x+=j==i?2.6:0;else x+=j==0?2.2:0;return x;}
function Wm(h){const M=[];for(let i=0;i<8;i++){const r=[];let m=0;for(let j=0;j<8;j++){if(j>i){r.push(0);continue}const e=Math.exp(b(h,i,j));r.push(e);m+=e;}M.push(r.map(x=>x/m));}return M;}
const X0=(r,c)=>(v(ID[r],c)+v(100+r,c))/2;
const WQ=(r,c)=>v(1000+r*3,c),WK=(r,c)=>v(1100+r*3,c),WV=(r,c)=>v(1200+r*3,c),Q=(r,c)=>v(200+r,c),K=(r,c)=>v(300+r,c),V=(r,c)=>v(400+r,c);
function outMat(h){const M=Wm(h),O=[];for(let i=0;i<8;i++){const r=[];for(let c=0;c<hs;c++){let a=0;for(let j=0;j<=i;j++)a+=M[i][j]*V(j,h*hs+c);r.push(a);}O.push(r);}return O;}
function trainLoss(t){return 1.5+2.7*Math.exp(-5*t);}
function probs(){const t=tr/100,L=trainLoss(t),p0=Math.exp(-L),bst=Math.log(p0*66/(1-p0)),P=[],Z=[];for(let r=0;r<8;r++){const z=[];for(let c=0;c<65;c++)z.push((v(r*7+1,c)-0.5)*1.6+(c==TID[TG[r]]?bst:0));const e=z.map(Math.exp),sum=e.reduce((a,q)=>a+q,0);Z.push(z);P.push(e.map(q=>q/sum));}return{Z,P};}
function stats(a){const m=a.reduce((p,q)=>p+q,0)/a.length,vr=a.reduce((p,q)=>p+(q-m)*(q-m),0)/a.length;return[m,Math.sqrt(vr),vr];}
function rowData(r,k){const sh=k*50,M=(v(r+sh,99)-0.5)*4,A2=0.5+v(r+sh,98)*2.5,raw=[];for(let c=0;c<32;c++)raw.push((v(620+r+sh,c)-0.5)*2*A2+M);const[m,sd,vr]=stats(raw),z=raw.map(q=>(q-m)/Math.sqrt(vr+1e-5)),y=z.map((q,c)=>q*(1+0.3*(v(1700+k,c)-0.5)*2)+0.3*(v(1750+k,c)-0.5)*2);return{raw,z,y,m,sd};}
const LNS={};function lnData(k){if(!LNS[k])LNS[k]=[0,1,2,3,4,5,6,7].map(r=>rowData(r,k));return LNS[k];}
function lnStep(k){const D=lnData(k),d=D[sel],zs=stats(d.z);let s=T(86,36,'x (8, 32)','th')+T(326,36,'normalized (8, 32)','th')+T(566,36,'output (8, 32)','th');
for(let r=0;r<8;r++)s+=T(22,57+14*r,CH[r],'ts','end');
s+=sheat(30,50,8,32,3.5,14,(r,c)=>D[r].raw[c],4,[sel])+A(150,106,258,106)+T(204,92,'(x − mean) / std','ts');
s+=sheat(270,50,8,32,3.5,14,(r,c)=>D[r].z[c],2.5,[sel])+A(390,106,498,106)+T(444,92,'× γ + β','ts');
s+=sheat(510,50,8,32,3.5,14,(r,c)=>D[r].y[c],2.5,[sel]);
s+=T(502,195,'γ','ts','end')+heat(510,190,1,32,3.5,10,'#7F77DD',(r,c)=>(1+0.3*(v(1700+k,c)-0.5)*2-0.7)/0.6,[]);
s+=T(502,213,'β','ts','end')+sheat(510,208,1,32,3.5,10,(r,c)=>0.3*(v(1750+k,c)-0.5)*2,0.35,[]);
s+=T(566,234,'learned, 32 numbers each','ts');
s+=T(30,196,`row ${sel} (${CH[sel]}) before: mean ${d.m.toFixed(2)}, std ${d.sd.toFixed(2)}`,'ts','start');
s+=T(30,218,`after normalizing: mean ${zs[0].toFixed(2)}, std ${zs[1].toFixed(2)}`,'ts','start');
s+=T(340,268,'Each row is normalized on its own, across its 32 channels. No row sees another.','ts');
const n2=k==1?'Layer norm 1: its output feeds Wq, Wk, Wv. The raw x keeps travelling on the skip path.':k==2?'Layer norm 2 (own γ, β): its output feeds W1 in the MLP. The raw x keeps travelling on the skip path.':'Final layer norm (own γ, β): its output feeds W_out.';
s+=T(340,290,n2,'ts');
s+=`<rect x="150" y="309" width="10" height="10" fill="#378ADD"/>`+T(166,314,'positive','ts','start')+`<rect x="250" y="309" width="10" height="10" fill="#D85A30"/>`+T(266,314,'negative','ts','start');
for(let r=0;r<8;r++)for(const xx of [30,270,510])s+=`<rect x="${xx}" y="${50+14*r}" width="112" height="14" fill="transparent" style="cursor:pointer" onclick="pickRow(${r})"/>`;
return s;}
function sBatch(){const TXT='First Citizen: Before we'.split('').map(c=>c==' '?'_':c);let s='';
TXT.forEach((c,i)=>{s+=B(28+26*i,48,24,24,i<=8?'c-amber':i>=15?'c-teal':'c-gray',c);});
s+=T(145,32,'window 1','ts')+T(534,32,'window 2','ts')+T(340,92,'B windows are cut from random places in the text','ts');
const x=['F','i','r','s','t','_','C','i'],y=['i','r','s','t','_','C','i','t'];
s+=T(14,151,'input x','ts','start')+T(14,221,'target y','ts','start');
for(let i=0;i<8;i++){const cx=170+46*i;s+=T(cx,122,'p'+i,'ts')+B(cx-20,136,40,30,'c-amber',x[i])+A(cx,168,cx,204)+B(cx-20,206,40,30,'c-green',y[i]);}
s+=T(340,262,'Position i sees x_0 to x_i and must predict y_i, the next character.','ts');
s+=T(340,284,'A batch stacks B windows: x is (B, 8) and y is (B, 8), so one batch gives B × 8 predictions.','ts');
return s;}
function s0(){let s=T(14,45,'characters','ts','start')+T(14,115,'token IDs','ts','start');
for(let i=0;i<8;i++){const cx=172+56*i;s+=B(cx-22,30,44,30,'c-gray',CH[i])+A(cx,62,cx,98)+B(cx-22,100,44,30,'c-blue',ID[i]);}
s+=T(596,115,'used once','ts','start');
s+=A(368,132,368,152)+T(380,142,'each ID picks one row of the table','ts','start');
s+=T(124,170,'token table (65 × 32)','th')+heat(60,182,65,32,4,3,'#1D9E75',(r,c)=>v(r,c),[]);
[...new Set(ID)].forEach(id=>{s+=`<rect x="60" y="${182+id*3}" width="128" height="3" fill="none" stroke="#BA7517" stroke-width="1.5"/>`;});
s+=A(192,270,360,270)+T(276,252,'copy the 8 selected rows','ts');
s+=T(460,170,'rows copied (8, 32)','th')+heat(380,196,8,32,5,18,'#1D9E75',(r,c)=>v(ID[r],c),[]);
for(let r=0;r<8;r++)s+=T(372,205+18*r,CH[r],'ts','end');
s+=T(552,250,'ID used once,','ts','start')+T(552,268,'then dropped','ts','start');
return s;}
function s1(){let s=T(120,50,'token rows (8, 32)','th')+T(330,50,'position table P (8 × 32)','th')+T(540,50,'x = sum (8, 32)','th');
s+=heat(40,70,8,16,10,16,'#1D9E75',(r,c)=>v(ID[r],c),[1,7]);
s+=heat(250,70,8,16,10,16,'#EF9F27',(r,c)=>v(100+r,c),[1,7]);
s+=heat(460,70,8,16,10,16,'#7F77DD',X0,[1,7]);
s+=T(225,134,'+','th')+T(435,134,'=','th');
for(let r=0;r<8;r++)s+=T(32,78+16*r,CH[r],'ts','end');
s+=T(340,225,'Outlined rows are both i: same token row, different position row, so different x','ts');
return s;}
function s2(){let s='';
[[44,'q','Wq',WQ,Q,'what each row looks for'],[162,'k','Wk',WK,K,'what each row offers'],[280,'v','Wv',WV,V,'what each row hands over']].forEach(([y,n,w,W,R,d])=>{
s+=T(78,y-14,'LN₁(x) (8, 32)','th')+heat(30,y+24,8,32,3,6,'#7F77DD',X0,[]);
s+=T(148,y+48,'·','th')+T(218,y-14,`${w} (32 × 32)`,'th')+heat(170,y,32,32,3,3,'#378ADD',W,[]);
s+=T(286,y+48,'=','th')+T(354,y-14,`${n} (8, 32)`,'th')+heat(306,y+24,8,32,3,6,'#D85A30',R,[]);
s+=T(420,y+40,`${n} = LN₁(x) · ${w}`,'th','start')+T(420,y+58,d,'ts','start');});
s+=T(340,402,'The input is layer norm 1 of x. Wq, Wk, Wv are learned and used without a bias.','ts');
return s;}
function s3(){let s=T(104,40,'Wq (32 × 32), same cut','th');
for(let k=0;k<nh;k++)s+=T(40+hs*4*k+hs*2,58,'h'+(k+1),'ts')+heat(40+hs*4*k,70,32,hs,4,4,hc(k),(r,c)=>WQ(r,k*hs+c),[]);
s+=`<line class="leader" x1="172" y1="134" x2="296" y2="94"/>`+T(234,96,'same cut','ts');
s+=T(396,40,'q, k, v (8, 32) each','th');
[['q',70,Q],['k',150,K],['v',230,V]].forEach(([n,y,F])=>{for(let k=0;k<nh;k++){if(n=='q')s+=T(300+hs*6*k+hs*3,58,'h'+(k+1),'ts');s+=heat(300+hs*6*k,y,8,hs,6,6,hc(k),(r,c)=>F(r,k*hs+c),[]);}s+=T(504,y+24,n,'th','start');});
s+=T(340,306,`${nh} head${nh>1?'s':''} × ${hs} channels each`,'th');
s+=T(340,328,'Slicing q, k, v is the only step. The Wq blocks show the same cut, not a second operation.','ts');
return s;}
function s4(){const col=hc(hd),cwq=96/hs,rhk=176/hs;let s=T(78,40,`q_h (8, ${hs})`,'th')+T(238,40,`k_hᵀ (${hs}, 8)`,'th')+T(438,40,'scores (8, 8)','th');
for(let r=0;r<8;r++)s+=T(24,81+22*r,CH[r],'ts','end');
for(let j=0;j<8;j++)s+=T(161+22*j,62,CH[j],'ts')+T(361+22*j,62,CH[j],'ts');
s+=heat(30,70,8,hs,cwq,22,col,(r,c)=>Q(r,hd*hs+c),[si])+T(138,158,'·','th');
s+=heat(150,70,hs,8,22,rhk,col,(r,c)=>K(c,hd*hs+r),[]);
s+=`<rect x="${150+22*sj}" y="70" width="22" height="176" fill="none" stroke="#BA7517" stroke-width="2"/>`;
s+=T(338,158,'=','th')+heat(350,70,8,8,22,22,col,(r,c)=>Math.min(1,b(hd,r,c)/3.5),[]);
s+=`<rect x="${350+22*sj}" y="${70+22*si}" width="22" height="22" fill="none" stroke="#BA7517" stroke-width="2"/>`;
for(let i=0;i<8;i++)for(let j=0;j<8;j++)s+=`<rect x="${350+22*j}" y="${70+22*i}" width="22" height="22" fill="transparent" style="cursor:pointer" onclick="pickCell(${i},${j})"/>`;
s+=T(340,274,`score(${si}, ${sj}) = q_${si} · k_${sj} = ${b(hd,si,sj).toFixed(2)}`,'th');
s+=T(340,298,`Each cell is one dot product: row ${si} of q_h against row ${sj} of k_h (a column of k_hᵀ).`,'ts');
s+=T(340,320,'Cells above the diagonal are computed too. The next step blocks them.','ts');
s+=T(340,342,'click a cell to change the pair','ts');
return s;}
function s5(){const M=Wm(hd),col=hc(hd),cw=12,y0=64,X=[20,152,284,416,548],cv=96/hs,VS=(r,c)=>V(r,hd*hs+c),O=outMat(hd);
const ti=[['scores','q_h · k_hᵀ'],['masked','future = −∞'],['weights','after softmax'],['v_h',`(8, ${hs})`],['out_h','weights · v_h']];
